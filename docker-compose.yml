      timeout: 5s
      retries: 3
    networks:
      - external

  glitchtip:
    image: glitchtip/glitchtip:latest
    container_name: glitchtip
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD:-glitchtip}@glitchtip-db:5432/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      GLITCHTIP_DOMAIN: http://localhost:8090
      GLITCHTIP_MAX_EVENT_LIFE_DAYS: 90
      VALKEY_URL: ""
      PORT: 8080
      CELERY_WORKER_CONCURRENCY: 1
      DJANGO_SUPERUSER_EMAIL: ${GLITCHTIP_ADMIN_EMAIL:-admin@connectome.local}
      DJANGO_SUPERUSER_PASSWORD: ${GLITCHTIP_ADMIN_PASSWORD:-glitchtip-admin}
