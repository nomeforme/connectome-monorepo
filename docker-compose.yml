# ============================================
# VOLUMES
# ============================================
volumes:
  # Connectome VEIL state persistence
  connectome-state:
    driver: local
  # Shared workspace for cross-bot collaboration
  shared-workspace:
    driver: local
  # Per-bot system-prompt overrides (written by axons, read-only in bot-runtimes)
  bot-config-overrides:
    driver: local
  # GlitchTip error monitoring
  glitchtip-db-data:
    driver: local
  glitchtip-uploads:
    driver: local
  # TODO: do not delete — uncomment when whatsapp-axon is ready
  # whatsapp-auth-state:
  #   driver: local
  # House (profile "house") — new, never the fleet's own state volumes above.
  house-runs:
    driver: local
  house-private:
    driver: local
  house-shared:
    driver: local
  house-seat:
    driver: local
  house-signal-data:
    driver: local

# ============================================
# NETWORKS
# ============================================
networks:
  # Internal-only network for gRPC traffic between services.
  # Containers on this network CANNOT reach the internet.
  # Connectome server lives exclusively here — air-gapped from external.
  grpc-internal:
    driver: bridge
    internal: true

  # External network for services that need internet access
  # (Discord API, Signal servers, LLM providers, error tracking).
  external:
    driver: bridge
