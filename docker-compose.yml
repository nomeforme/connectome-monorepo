      SIGNAL_PHONE: ${SIGNAL_PHONE_CLAUDE_FABLE_5}
      SOLANA_PRIVATE_KEY: ${SOLANA_PRIVATE_KEY_CLAUDE_FABLE_5:-}
      EVM_PRIVATE_KEY: ${EVM_PRIVATE_KEY_CLAUDE_FABLE_5:-}

  # Claude Sonnet 5 — Anthropic model (pi OAuth / API key). Standard Claude bot.
  # Discord/Signal creds default empty until provided (bot skips those axons).
  bot-sonnet-5:
    <<: *bot-runtime
    container_name: bot-sonnet-5
    ports:
      - "127.0.0.1:9118:8000"
    environment:
      <<: *bot-env
      BOT_NAME: claude-sonnet-5
      DISCORD_TOKEN: ${DISCORD_TOKEN_CLAUDE_SONNET_5:-}
      SIGNAL_PHONE: ${SIGNAL_PHONE_CLAUDE_SONNET_5:-}
      SOLANA_PRIVATE_KEY: ${SOLANA_PRIVATE_KEY_CLAUDE_SONNET_5:-}
      EVM_PRIVATE_KEY: ${EVM_PRIVATE_KEY_CLAUDE_SONNET_5:-}

  # plantoid — local-Qwen-backed bot (persona "plantoid"). Served by llama-server
  # on the plantoidz GPU box over Tailscale; endpoint + context_window live in
  # bot-runtime/config.json → plantoid. LOCAL_LLM_API_KEY is a throwaway
  # (llama-server has no auth) unless it was started with --api-key. Transparent
  # to connectome: registers over gRPC as agent "plantoid" like any other bot.
  # Discord/Signal creds default empty until provided.
  bot-plantoid:
    <<: *bot-runtime
    container_name: bot-plantoid
    ports:
      - "127.0.0.1:9119:8000"
    environment:
      <<: *bot-env
      BOT_NAME: plantoid
      LOCAL_LLM_API_KEY: ${LOCAL_LLM_API_KEY:-sk-local}
      DISCORD_TOKEN: ${DISCORD_TOKEN_PLANTOID:-}
      SIGNAL_PHONE: ${SIGNAL_PHONE_PLANTOID:-}

  # Claude Opus 5 — Anthropic model (pi OAuth / API key). Standard Claude bot.
  # Model pinned in bot-runtime/model-resolver.ts until we move to the pi 0.82 auth
  # model (opus-5 entered pi's registry in 0.82.x). Discord/Signal creds default
  # empty until provided (bot skips those axons).
  bot-opus-5:
    <<: *bot-runtime
    container_name: bot-opus-5
    ports:
      - "127.0.0.1:9120:8000"
    environment:
      <<: *bot-env
      BOT_NAME: claude-opus-5
      DISCORD_TOKEN: ${DISCORD_TOKEN_CLAUDE_OPUS_5:-}
      SIGNAL_PHONE: ${SIGNAL_PHONE_CLAUDE_OPUS_5:-}
      SOLANA_PRIVATE_KEY: ${SOLANA_PRIVATE_KEY_CLAUDE_OPUS_5:-}
      EVM_PRIVATE_KEY: ${EVM_PRIVATE_KEY_CLAUDE_OPUS_5:-}

  # ============================================
  # GLITCHTIP — Error Monitoring
  # ============================================
  glitchtip-db:
    image: postgres:16-alpine
    container_name: glitchtip-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD:-glitchtip}
    volumes:
      - glitchtip-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - external

  glitchtip:
    image: glitchtip/glitchtip:latest
    container_name: glitchtip
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD:-glitchtip}@glitchtip-db:5432/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      GLITCHTIP_DOMAIN: http://localhost:8090
      GLITCHTIP_MAX_EVENT_LIFE_DAYS: 90
      VALKEY_URL: ""
      PORT: 8080
      CELERY_WORKER_CONCURRENCY: 1
      DJANGO_SUPERUSER_EMAIL: ${GLITCHTIP_ADMIN_EMAIL:-admin@connectome.local}
      DJANGO_SUPERUSER_PASSWORD: ${GLITCHTIP_ADMIN_PASSWORD:-glitchtip-admin}
    entrypoint: "/entrypoint.sh"
    depends_on:
      glitchtip-db:
        condition: service_healthy
    volumes:
      - glitchtip-uploads:/code/uploads
      - ./scripts/glitchtip-entrypoint.sh:/entrypoint.sh:ro
    networks:
      - external

  # ============================================
  # SIGNAL-CLI - Signal CLI REST API
  # ============================================
  signal-cli:
    image: bbernhard/signal-cli-rest-api:0.99
    container_name: signal-cli
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ${HOME}/.local/share/signal-api:/home/.local/share/signal-cli
      # Override bbernhard's bundled signal-cli (0.14.3 in wrapper 0.99) with our
      # build of 0.14.5 which fixes the upstream getServerGuid NPE on sealed-sender
      # envelopes after Signal's server-side change in June 2026 (AsamK/signal-cli#2059).
      # 0.99 wrapper chosen for its Java 25 runtime (matches our build's class version).
      # Built via /opt/build/signal-cli/reproducible-builds/build.sh; remove this
      # volume mount once bbernhard releases a wrapper bundling signal-cli >= 0.14.5.
      - /opt/build/signal-cli-extracted/signal-cli-0.14.5:/opt/signal-cli-0.14.3:ro
    environment:
      - MODE=json-rpc
      # Note: AUTO_RECEIVE_SCHEDULE not needed in json-rpc mode (daemon handles it)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/about"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      # signal-axon reaches signal-cli via external network
      - external

# ============================================
# VOLUMES
# ============================================
volumes:
  # Connectome VEIL state persistence
  connectome-state:
    driver: local
  # Shared workspace for cross-bot collaboration
  shared-workspace:
    driver: local
  # Per-bot system-prompt overrides (written by axons, read-only in bot-runtimes)
  bot-config-overrides:
    driver: local
  # GlitchTip error monitoring
  glitchtip-db-data:
    driver: local
  glitchtip-uploads:
    driver: local
  # TODO: do not delete — uncomment when whatsapp-axon is ready
  # whatsapp-auth-state:
  #   driver: local

# ============================================
# NETWORKS
# ============================================
networks:
  # Internal-only network for gRPC traffic between services.
  # Containers on this network CANNOT reach the internet.
  # Connectome server lives exclusively here — air-gapped from external.
  grpc-internal:
    driver: bridge
    internal: true

  # External network for services that need internet access
  # (Discord API, Signal servers, LLM providers, error tracking).
  external:
    driver: bridge
