# Connectome gRPC Microservices Docker Compose
#
# Security layers (OpenShell-inspired):
#   1. Custom seccomp profiles — block raw sockets, kernel modules, namespace creation
#   2. Landlock — filesystem restrictions (opt-in via LANDLOCK_ENABLED=true)
#   3. Read-only root filesystem + tmpfs — minimize writable paths
#   4. mTLS for gRPC — opt-in via GRPC_TLS=true (run docker/gen-certs.sh first)
#   5. Network segmentation — connectome air-gapped on internal-only network
#   6. Credential isolation — API keys from file secrets, not env vars
#
# Setup:
#   echo "$ANTHROPIC_API_KEY" > secrets/anthropic_api_key
#   docker/gen-certs.sh          # optional: generate mTLS certs
#   docker compose up -d

# ============================================
# EXTENSION FIELDS — reusable bot-runtime template
# ============================================
x-bot-runtime: &bot-runtime
  build:
    context: .
    dockerfile: docker/bot-runtime.Dockerfile
  restart: unless-stopped
  read_only: true
  security_opt:
    - seccomp=docker/seccomp-bot.json
  tmpfs:
    - /tmp:size=512m
    - /home/coder:size=64m
    - /root/.npm:size=64m
    - /root/.cache:size=128m
    - /root/.ssh:size=1m
  environment: &bot-env
    CONNECTOME_GRPC_HOST: connectome:50051
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    AWS_REGION: ${AWS_REGION:-us-east-1}
    AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
    # Vercel AI Gateway — aggregator route for models whose direct/Bedrock
    # routes are sunset (e.g. claude-opus-4 via vertex). Picked up by
    # ConnectomeAgent's streamFn wrapper when model.provider === 'vercel-ai-gateway'.
    VERCEL_AI_GATEWAY_API_KEY: ${VERCEL_AI_GATEWAY_API_KEY:-}
    WOLFRAM_API_KEY: ${WOLFRAM_API_KEY:-}
    GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
    BOT_HTTP_PORT: "8000"
    DISCORD_AXON_HOST: discord-axon:50052
    SIGNAL_AXON_HOST: signal-axon:50053
    WEB_AXON_HOST: web-axon:50056
    # TODO: uncomment when whatsapp-axon is ready
    # WHATSAPP_AXON_HOST: whatsapp-axon:50054
    # TODO: uncomment when telegram-axon is ready
    # TELEGRAM_AXON_HOST: telegram-axon:50055
    COMPUTE_HOSTS: ${COMPUTE_HOSTS:-}
    KOHYA_MCP_URL: ${KOHYA_MCP_URL:-}
    SOLANA_PRIVATE_KEY: ${SOLANA_PRIVATE_KEY:-}
    EVM_PRIVATE_KEY: ${EVM_PRIVATE_KEY:-}
    WALLET_CHAINS: solana|solana-devnet|https://solana-devnet.g.alchemy.com/v2/${ALCHEMY_API_KEY},evm|base-sepolia|https://base-sepolia.g.alchemy.com/v2/${ALCHEMY_API_KEY}|84532
    # mTLS (opt-in — run docker/gen-certs.sh first)
    GRPC_TLS: ${GRPC_TLS:-false}
    # Landlock filesystem restrictions (opt-in)
    LANDLOCK_ENABLED: ${LANDLOCK_ENABLED:-false}
  volumes: &bot-volumes
    - ./bot-runtime/config.json:/workspace/bot-runtime/config.json:ro
    - shared-workspace:/workspace/shared
    # Per-bot system-prompt overrides (written by axon command effectors on
    # `!sysprompt override`, read by bot-runtime at boot). Read-only here so
    # bot tools (terminal/process) can't accidentally delete or corrupt them.
    - bot-config-overrides:/workspace/bot-config-overrides:ro
    - ${HOME}/.pi/agent:/root/.pi/agent  # pi OAuth auth (Claude Max/Pro subscription)
    - ./secrets/wallet_master_key:/workspace/secrets/wallet_master_key:ro
    # Credential isolation: API key as file secret (not env var)
    - ./secrets/anthropic_api_key:/run/secrets/anthropic_api_key:ro
    # mTLS certs (when GRPC_TLS=true)
    - ./docker/certs:/workspace/certs:ro
  depends_on:
    connectome:
      condition: service_healthy
    connectome-mcp:
      condition: service_healthy
    web-axon:
      condition: service_started
  networks:
    - grpc-internal
    - external

services:
  # ============================================
  # CONNECTOME - Central gRPC Server
  # ============================================
  connectome:
    build:
      context: .
      dockerfile: docker/connectome.Dockerfile
    container_name: connectome
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m
    ports:
      - "50051:50051"   # gRPC server
      - "3015:3015"     # Debug UI (optional)
    volumes:
      - connectome-state:/workspace/connectome-ts/state
      # mTLS certs (when GRPC_TLS=true)
      - ./docker/certs:/workspace/certs:ro
    environment:
      - NODE_ENV=production
      - GRPC_PORT=50051
      - GRPC_HOST=0.0.0.0
      - PERSISTENCE_ENABLED=true
      - PERSISTENCE_DIR=/workspace/connectome-ts/state
      - DEBUG_ENABLED=${DEBUG_ENABLED:-false}
      - DEBUG_PORT=3015
      - GLITCHTIP_DSN=${GLITCHTIP_DSN:-}
      - GRPC_TLS=${GRPC_TLS:-false}
      # Node heap ceiling raised to 8GB so snapshot restore can replay the full
      # 5163-frame history across 433 snapshots without SIGABRT (exit 134) at
      # the V8 ~4GB default. Host has 15GB; ~6GB headroom after this.
      - NODE_OPTIONS=--max-old-space-size=8192
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(50051).on('error', () => process.exit(1)).on('connect', () => process.exit(0))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      # Air-gapped: connectome has ZERO internet access
      - grpc-internal

  # ============================================
  # CONNECTOME-MCP — MCP Server for bot-runtime
  # ============================================
  connectome-mcp:
    build:
      context: .
      dockerfile: docker/connectome-mcp.Dockerfile
    container_name: connectome-mcp
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m
    ports:
      - "3100:3100"
    volumes:
      - shared-workspace:/workspace/shared
      - connectome-state:/workspace/connectome-state-data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - .:/opt/connectome:ro
    environment:
      - NODE_ENV=production
      - MCP_PORT=3100
      - CONNECTOME_HOST=connectome
      - CONNECTOME_PORT=50051
      - COMPOSE_DIR=/opt/connectome
      - WORKSPACE_PATH=/workspace/shared
      - CONNECTOME_STATE_DIR=/workspace/connectome-state-data
    depends_on:
      connectome:
        condition: service_healthy
    networks:
      - grpc-internal
      - external        # host port mapping requires non-internal network

  # ============================================
  # SIGNAL-AXON - Signal Messenger Client
  # ============================================
  signal-axon:
    build:
      context: .
      dockerfile: docker/signal-axon.Dockerfile
    container_name: signal-axon
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m
    ports:
      - "8082:8082"     # AXON module server (if needed)
      - "50053:50053"   # Axon binding server
    volumes:
      # mTLS certs
      - ./docker/certs:/workspace/certs:ro
      # Shared workspace (for !secret command)
      - shared-workspace:/workspace/shared
      # Per-bot system-prompt overrides (rw — the axon writes on !sysprompt override)
      - bot-config-overrides:/workspace/bot-config-overrides
    environment:
      - NODE_ENV=production
      - CONNECTOME_GRPC_HOST=connectome:50051
      - AXON_BINDING_PORT=50053
      - SIGNAL_CLI_WS_URL=ws://signal-cli:8080
      - SIGNAL_CLI_API_URL=http://signal-cli:8080
      # BOT_PHONE_NUMBERS and SIGNAL_BOT_NAMES removed — bots arrive via axon binding
      - RANDOM_REPLY_CHANCE=${SIGNAL_RANDOM_REPLY_CHANCE:-1000}
      - MAX_BOT_MENTIONS=${SIGNAL_MAX_BOT_MENTIONS:-1}
      - MAX_CONVERSATION_FRAMES=${SIGNAL_MAX_CONVERSATION_FRAMES:-100}
      - MAX_MESSAGE_LENGTH=${SIGNAL_MAX_MESSAGE_LENGTH:-0}   # 0 = native (no split; Signal "see more" handles long messages)
      - GROUP_PRIVACY_MODE=${SIGNAL_GROUP_PRIVACY_MODE:-opt-out}
      - GLITCHTIP_DSN=${GLITCHTIP_DSN:-}
      - GRPC_TLS=${GRPC_TLS:-false}
    depends_on:
      connectome:
        condition: service_healthy
      signal-cli:
        condition: service_healthy
    networks:
      - grpc-internal   # gRPC to connectome
      - external        # Signal CLI API

  # ============================================
  # DISCORD-AXON - Discord Client
  # ============================================
  discord-axon:
    build:
      context: .
      dockerfile: docker/discord-axon.Dockerfile
    container_name: discord-axon
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m
    ports:
      - "8092:8082"     # AXON module server (mapped to different host port)
      - "50052:50052"   # Axon binding server
    volumes:
      # mTLS certs
      - ./docker/certs:/workspace/certs:ro
      # Shared workspace (for !secret command)
      - shared-workspace:/workspace/shared
      # Per-bot system-prompt overrides (rw — the axon writes on !sysprompt override)
      - bot-config-overrides:/workspace/bot-config-overrides
    environment:
      - NODE_ENV=production
      - CONNECTOME_GRPC_HOST=connectome:50051
      - AXON_BINDING_PORT=50052
      # DISCORD_BOT_TOKENS removed — bots arrive via axon binding
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID:-}
      - DISCORD_CHANNEL_ID=${DISCORD_CHANNEL_ID:-}
      - RANDOM_REPLY_CHANCE=${DISCORD_RANDOM_REPLY_CHANCE:-1000}
      - MAX_BOT_MENTIONS=${DISCORD_MAX_BOT_MENTIONS:-1}
      - MAX_CONVERSATION_FRAMES=${DISCORD_MAX_CONVERSATION_FRAMES:-100}
      - MAX_MESSAGE_LENGTH=${DISCORD_MAX_MESSAGE_LENGTH:-2000}
      - GLITCHTIP_DSN=${GLITCHTIP_DSN:-}
      - GRPC_TLS=${GRPC_TLS:-false}
    depends_on:
      connectome:
        condition: service_healthy
    networks:
      - grpc-internal   # gRPC to connectome
      - external        # Discord gateway API

  # ============================================
  # WEB-AXON - WebSocket Client (Generic Frontend)
  # ============================================
  web-axon:
    build:
      context: .
      dockerfile: docker/web-axon.Dockerfile
    container_name: web-axon
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m
    ports:
      - "8085:8080"     # WebSocket server
      - "50056:50056"   # Axon binding server
    volumes:
      - ./docker/certs:/workspace/certs:ro
      - shared-workspace:/workspace/shared
      # Per-bot system-prompt overrides (rw — the axon writes on !sysprompt override)
      - bot-config-overrides:/workspace/bot-config-overrides
    environment:
      - NODE_ENV=production
      - CONNECTOME_GRPC_HOST=connectome:50051
      - WEB_AXON_PORT=8080
      - AXON_BINDING_PORT=50056
      - RANDOM_REPLY_CHANCE=${WEB_RANDOM_REPLY_CHANCE:-0}
      - MAX_BOT_MENTIONS=${WEB_MAX_BOT_MENTIONS:-3}
      - MAX_CONVERSATION_FRAMES=${WEB_MAX_CONVERSATION_FRAMES:-100}
      - GLITCHTIP_DSN=${GLITCHTIP_DSN:-}
      - GRPC_TLS=${GRPC_TLS:-false}
    depends_on:
      connectome:
        condition: service_healthy
    networks:
      - grpc-internal
      - external

