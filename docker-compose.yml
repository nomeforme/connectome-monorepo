  # ============================================
  # WEB BOARD — profile "board" (web-board/README.md,
  # docs/web-board/contract.md). The standalone Commons Board: knows
  # nothing about the house. Seats (mcpl-web) reach it on the `external`
  # network at http://web-board:8090; the host reaches it on loopback
  # only (host 8090 is taken). Its data dir (board.config.json,
  # tokens.json, board.sqlite) is its own named volume.
  # Brought up with `docker compose --profile board up -d --build web-board`.
  # ============================================
  web-board:
    profiles: ["board"]
    build:
      context: .
      dockerfile: docker/web-board.Dockerfile
    image: connectome-web-board:latest
    container_name: web-board
    restart: unless-stopped
    environment:
      WEB_BOARD_DATA: /data
      WEB_BOARD_PORT: "8090"
      WEB_BOARD_PUBLIC_URL: ${WEB_BOARD_PUBLIC_URL:-http://localhost:8095}
    ports:
      - "127.0.0.1:8095:8090"
    volumes:
      - web-board-data:/data
    networks:
      - external

  # The board's own public address: a separate Tailscale node (its own name,
  # its own state volume), funnelling only https://<name>.<tailnet>.ts.net
  # to web-board. Independent of this machine's own tailscaled. First start
  # with no TS_AUTHKEY prints a login URL to approve once (docker logs
  # board-funnel); the node then stays logged in via its volume. Moving the
  # board elsewhere = move this volume too, same URL.
  board-funnel:
    profiles: ["board"]
    image: tailscale/tailscale:v1.102.3
    container_name: board-funnel
    hostname: commons-board
    restart: unless-stopped
    environment:
      TS_HOSTNAME: commons-board
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/funnel-serve.json
      TS_AUTHKEY: ${BOARD_FUNNEL_AUTHKEY:-}
    volumes:
      - board-funnel-state:/var/lib/tailscale
      - ./docker/web-board/funnel-serve.json:/config/funnel-serve.json:ro
    networks:
      - external
    depends_on:
      - web-board

# ============================================
# VOLUMES
# ============================================
volumes:
  # Shared workspace for cross-bot collaboration
  shared-workspace:
    driver: local
  # GlitchTip error monitoring
  glitchtip-db-data:
    driver: local
  glitchtip-uploads:
    driver: local
  # TODO: do not delete — uncomment when whatsapp-axon is ready
  # whatsapp-auth-state:
  #   driver: local
  # House (profile "house") — new, never the fleet's own state volumes above.
  house-runs:
    driver: local
  house-private:
    driver: local
  house-shared:
    driver: local
  house-seat:
    driver: local
  house-signal-data:
    driver: local
  # Web board (profile "board"): board.config.json, tokens.json, board.sqlite
  web-board-data:
    driver: local
  # the board funnel node's identity (profile "board")
  board-funnel-state:
    driver: local

# ============================================
# NETWORKS
# ============================================
networks:
  # Internal-only network for gRPC traffic between services.
  # Containers on this network CANNOT reach the internet.
  # Connectome server lives exclusively here — air-gapped from external.
  grpc-internal:
    driver: bridge
    internal: true

  # External network for services that need internet access
  # (Discord API, Signal servers, LLM providers, error tracking).
  external:
    driver: bridge
