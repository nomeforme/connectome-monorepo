  # ============================================
  # SIGNAL-CLI - Signal CLI REST API
  # ============================================
  signal-cli:
    image: bbernhard/signal-cli-rest-api:0.99
    container_name: signal-cli
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ${HOME}/.local/share/signal-api:/home/.local/share/signal-cli
      # Override bbernhard's bundled signal-cli (0.14.3 in wrapper 0.99) with our
      # build of 0.14.5 which fixes the upstream getServerGuid NPE on sealed-sender
      # envelopes after Signal's server-side change in June 2026 (AsamK/signal-cli#2059).
      # 0.99 wrapper chosen for its Java 25 runtime (matches our build's class version).
      # Built via /opt/build/signal-cli/reproducible-builds/build.sh; remove this
      # volume mount once bbernhard releases a wrapper bundling signal-cli >= 0.14.5.
      - /opt/build/signal-cli-extracted/signal-cli-0.14.5:/opt/signal-cli-0.14.3:ro
    environment:
      - MODE=json-rpc
      # Note: AUTO_RECEIVE_SCHEDULE not needed in json-rpc mode (daemon handles it)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/about"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      # signal-axon reaches signal-cli via external network
      - external

  # ============================================
  # HOUSE — profile "house" (docs/harness-port/03-house-design.md,
  # docs/harness-port/07-deploy.md). A separate deployable service
  # standing up beside the fleet, not replacing anything in the default
  # profile: `docker compose config` with no --profile flag resolves
  # identically to before this block was added. Brought up with
  # `docker compose --profile house up -d --build house house-signal-cli`.
  # ============================================
  house:
    profiles: ["house"]
    build:
      context: .
      dockerfile: docker/house/Dockerfile
    container_name: house
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m
      - /home/house:size=32m
    ports:
      # loopback-only, matching connectome-house/src/serve.mjs's own
      # keeper-side-local default posture.
      - "127.0.0.1:8787:8787"
    # HOUSE_ID / HOUSE_KEEPERS / HOUSE_IDENTITY_SALT ride in via env_file
    # (below), never as inline ${VAR:-} interpolation — the salt in
    # particular must never touch a shell history or `docker compose
    # config` output. `house/house.env` is gitignored (docs/harness-port/
    # 09-container-proof.md, builder P-E, 2026-09-17).
    env_file:
      - ./house/house.env
    environment:
      # serve.mjs's own default (HOUSE_HOST unset) binds to 127.0.0.1
      # INSIDE the container's own netns — unreachable via Docker's port
      # publish, which connects to the container over the bridge network,
      # not its loopback. `"127.0.0.1:8787:8787"` above is what actually
      # keeps this loopback-only (host-side); the container itself must
      # listen on every interface for that publish to reach it at all.
      # Found on this round's first boot: `curl 127.0.0.1:8787/...` from
      # the box itself reset the connection until this was added
      # (docs/harness-port/09-container-proof.md, builder P-E, 2026-09-17).
      HOUSE_HOST: "0.0.0.0"
      HOUSE_RUNS_DIR: /workspace/runs
      HOUSE_PRIVATE_DIR: /workspace/private
      HOUSE_BLOB_ROOT: /workspace/shared/blobs
      HOUSE_COVENANTS_DIR: /workspace/house-config/covenants
      HOUSE_MCPL_SERVERS: /workspace/house-config/servers.json
      # unix socket on the house-seat volume, shared with being containers
      # (docs/harness-port/03-house-design.md §2.3); a deployment may add
      # a tcp form on the compose network instead.
      HOUSE_SEAT_ADDR: unix:/workspace/house-seat/house.sock
      # docs/harness-port/25-outbound-guardrail.md — the hard outbound
      # guardrail born of the 2026-09-20 retrofit-replay cascade. Defaults
      # match that doc's own table exactly; the keeper flips HOUSE_OUTBOUND
      # or touches/removes ${HOUSE_PRIVATE_DIR}/outbound.off to mute/unmute
      # without a restart (rule 1).
      HOUSE_OUTBOUND: "on"
      HOUSE_OUTBOUND_MAX_AGE_MS: "600000"
      HOUSE_OUTBOUND_RATE_SEAT: "6"
      HOUSE_OUTBOUND_RATE_BEING: "30"
      HOUSE_OUTBOUND_RATE_HOUSE: "120"
      HOUSE_BOT_CHAIN_MAX: "3"
      # the fleet's own signal-cli instance and number, a second
      # consumer (docs/harness-port/12-signal-two-consumers.md §5) —
      # never house-signal-cli (kept below, commented, per that same
      # §5 recommendation against a dedicated/linked-device identity).
      SIGNAL_CLI_URL: http://signal-cli:8080
      # HOUSE_SIGNAL_URL_DEDICATED: http://house-signal-cli:8080
      # A deployment's own house/servers.json names the credential env
      # VAR NAMES a given MCPL child may read (mcpl/config.mjs's own
      # `env` list) — whatever it names must also be listed here, by
      # name, so the house's own spawnWire/childEnv can pass it down.
      # These were placeholders for the dedicated pilot identities
      # 03-house-design.md §4 and 06-rounds.md R3-B originally called for
      # (never a fleet bot's token or number).
      # Commented out (harness-port Q1-B, 2026-09-18): K14's live decision
      # (docs/harness-port/08-pilot-observe.md §1) reverses that plan — the
      # pilot observes using the box's OWN existing bot identity
      # (claude-3-opus) by reference, below, never a newly-provisioned
      # pilot account. Left here, commented, rather than removed, in case
      # a later pilot round wants a dedicated identity after all.
      # HOUSE_DISCORD_TOKEN_PILOT: ${HOUSE_DISCORD_TOKEN_PILOT:-}
      # HOUSE_SIGNAL_NUMBER_PILOT: ${HOUSE_SIGNAL_NUMBER_PILOT:-}
      # The pilot's real credential, by reference only (docs/harness-port/
      # 08-pilot-observe.md §1, §4): house/servers.json's own "env" field
      # names "DISCORD_TOKEN=DISCORD_TOKEN_CLAUDE_3_OPUS" — the spawned
      # mcpl-discord child reads DISCORD_TOKEN from the house's OWN
      # DISCORD_TOKEN_CLAUDE_3_OPUS, which must resolve to the SAME value
      # already set for the fleet's own bot-3-opus service (never a copy
      # minted under a new name). A reference to a name, never a value.
      # Haiku's own DISCORD_TOKEN_CLAUDE_HAIKU_4_5 lived here through W5;
      # removed by harness-port W6-C (16-being-hosted-seats.md) — haiku's
      # Discord and Signal seats are now being-hosted (being-haiku-4-5,
      # below), so the house holds no credential for them at all. Only
      # DISCORD_TOKEN_CLAUDE_3_OPUS stays: the observe seat is kept
      # house-hosted for now, as a documented example of both modes.
      # Upstream discord-mcpl registers a guild slash command (/undo etc.)
      # on every guild at boot; the house never implements it and wants it
      # gone (mcpl-discord/README.md "Slash commands"). mcpl-discord/
      # config.mjs's own `env` grammar only passes NAMEs/CHILD=HOUSE pairs
      # through to a spawned child (never a literal value), so the literal
      # "1" is set here, on the house service itself, and house/
      # servers.json's discord-pilot-3-opus entry names the bare NAME in
      # its own `env` list so childEnv (connectome-house/src/mcpl/wire.mjs)
      # passes this same value down unchanged.
      DISCORD_DISABLE_SLASH_COMMANDS: "1"
      # house/servers.json's rooms[].stream expands these by name (config.mjs) —
      # same fleet channel(s) the axon bots already read, never a copied id.
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID:-}
      # SIGNAL_PHONE_CLAUDE_HAIKU_4_5 lived here through W5-A; removed by
      # harness-port W6-C — haiku's Signal seat is being-hosted now
      # (being-haiku-4-5's own SIGNAL_PHONE_CLAUDE_HAIKU_4_5, below). The
      # house holds no bot Signal identity at all in this shape.
      # C3-all: the ported house tools (C2-ports, commit 1db469e) run in
      # the HOUSE process, not a bot container — these env NAMEs, by
      # reference only, are what those tools read (connectome-house/src/
      # tools/**). Never a value minted here; same NAMEs the fleet's own
      # x-bot-env anchor already carries for the identical tools.
      INKFIELD_BRIDGE_URL: ${INKFIELD_BRIDGE_URL:-http://inkfield:8099}
      KOHYA_MCP_URL: ${KOHYA_MCP_URL:-}
      WALLET_CHAINS: solana|solana-devnet|https://solana-devnet.g.alchemy.com/v2/${ALCHEMY_API_KEY},evm|base-sepolia|https://base-sepolia.g.alchemy.com/v2/${ALCHEMY_API_KEY}|84532
      EVM_PRIVATE_KEY: ${EVM_PRIVATE_KEY:-}
      SOLANA_PRIVATE_KEY: ${SOLANA_PRIVATE_KEY:-}
      POLYMARKET_CLI: ${POLYMARKET_CLI:-}
    volumes:
      - house-runs:/workspace/runs
      - house-private:/workspace/private
      - house-shared:/workspace/shared
      - house-seat:/workspace/house-seat
      # keeper fills in: a servers.json (mcpl-signal/README.md,
      # mcpl-discord/README.md shapes; mcpl/config.mjs's own JSDoc is the
      # authoritative shape) and, optionally, a covenants/ dir
      # (03-house-design.md §6) — see docs/harness-port/07-deploy.md.
      - ./house/servers.json:/workspace/house-config/servers.json:ro
      - ./house/covenants:/workspace/house-config/covenants:ro
      # the wallet tools' master key (connectome-house/src/tools/wallet-
      # tools.mjs), same file the fleet's own &bot-volumes anchor mounts —
      # never a copy, never a value.
      - ./secrets/wallet_master_key:/workspace/secrets/wallet_master_key:ro
    depends_on:
      house-signal-cli:
        condition: service_healthy
    networks:
      - external

  house-signal-cli:
    profiles: ["house"]
    image: bbernhard/signal-cli-rest-api:0.99
    container_name: house-signal-cli
    restart: unless-stopped
    ports:
      # loopback-only; does not collide with the fleet's :8080 (signal-cli)
      # or :8082/:8085/:8090/:8092/:8099 (the fleet's other published ports).
      - "127.0.0.1:8093:8080"
    volumes:
      # its OWN data volume — never the fleet's signal-cli or its data
      # (03-house-design.md §4's identity discipline; 01 §4.3's
      # two-consumers-on-one-account risk).
      - house-signal-data:/home/.local/share/signal-cli
    environment:
      - MODE=json-rpc
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/about"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - external

  # Proven live (docs/harness-port/09-container-proof.md, builder P-E,
  # 2026-09-17): one real, sandboxed being container seated to the house
  # over the real socket, completing one real Haiku 4.5 turn via the
  # fleet's own OAuth store. NOT wired to the fleet's own axon/VEIL
  # environment at all — a real cutover (Round 4) still needs the being's
  # own entry code adapted further for a real platform's command lane.
  #
  # Built from docker/house/being-runtime.Dockerfile, a FORK of the
  # fleet's own docker/bot-runtime.Dockerfile (same base image, same tool
  # installs, same runtime user/paths — see that file's own header for
  # exactly what differs and why: bot-runtime's package.json depends on
  # two workspace packages, connectome-seat-protocol and
  # connectome-seat-client, that the shared Dockerfile's embedded
  # pnpm-workspace.yaml doesn't list yet — out of this task's owned scope
  # to fix in the shared file directly).
  # being-example — bot-runtime seat mode, RETIRED by phase W2
  # (docs/harness-port/13-walker-port.md; 09-container-proof.md's own
  # record stays as history). Replaced below by a walker-image being.
  # being-example:
  #   profiles: ["house"]
  #   build: {context: ., dockerfile: docker/house/being-runtime.Dockerfile}
  #   ... (full block: git log this file, or 09-container-proof.md)

  # Golden run (docs/harness-port/15-golden-run.md): one being on the
  # walker image, seated as claude-haiku-4-5 (09-container-proof.md's own
  # proven model, real OAuth) — the concrete instance of the x-being anchor.
  being-haiku-4-5:
    <<: *being
    build:
      context: .
      dockerfile: docker/house/being.Dockerfile
    container_name: being-haiku-4-5
    environment:
      <<: *being-env
      HOUSE_BEING: claude-haiku-4-5
      # this being's OWN platform credentials, by name only — never
      # another bot's (harness-port W6-C, 16-being-hosted-seats.md).
      # house/servers.json's discord-pilot-haiku-4-5 and signal-haiku-4-5
      # entries name these bare NAMEs in their own env/number_env fields.
      DISCORD_TOKEN_CLAUDE_HAIKU_4_5: ${DISCORD_TOKEN_CLAUDE_HAIKU_4_5:-}
      SIGNAL_PHONE_CLAUDE_HAIKU_4_5: ${SIGNAL_PHONE_CLAUDE_HAIKU_4_5:-}

  # C1 (docs/harness-port/18-c1-second-being.md): the second being on the
  # walker image, same shape as being-haiku-4-5 above — a Bedrock route
  # (docs/harness-port/14-model-routes.md: claude-3-sonnet ->
  # anthropic.claude-3-sonnet-20240229-v1:0, eu-west-2), same anchor.
  being-3-sonnet:
    <<: *being
    build:
      context: .
      dockerfile: docker/house/being.Dockerfile
    container_name: being-3-sonnet
    environment:
      <<: *being-env
      HOUSE_BEING: claude-3-sonnet
