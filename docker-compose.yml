# Connectome gRPC Microservices Docker Compose
#
# Security layers (OpenShell-inspired):
#   1. Custom seccomp profiles — block raw sockets, kernel modules, namespace creation
#   2. Landlock — filesystem restrictions (opt-in via LANDLOCK_ENABLED=true)
#   3. Read-only root filesystem + tmpfs — minimize writable paths
#   4. mTLS for gRPC — opt-in via GRPC_TLS=true (run docker/gen-certs.sh first)
#   5. Network segmentation — connectome air-gapped on internal-only network
#   6. Credential isolation — API keys from file secrets, not env vars
#
# Setup:
#   echo "$ANTHROPIC_API_KEY" > secrets/anthropic_api_key
#   docker/gen-certs.sh          # optional: generate mTLS certs
#   docker compose up -d

# harness-port W2-prep (docs/harness-port/13-walker-port.md phase W2):
# a being on the WALKER image (docker/house/being.Dockerfile), replacing
# being-example's bot-runtime seat mode (09-container-proof.md, retired).
x-being: &being
  profiles: ["house"]
  restart: unless-stopped
  # root, as every fleet bot ran (subscription auth is now a static env
  # token, ANTHROPIC_AUTH_TOKEN; no credential store is mounted)
  user: "0:0"
  read_only: true
  security_opt:
    - seccomp=docker/seccomp-bot.json
  tmpfs:
    - /tmp:size=512m
    - /home/coder:size=64m
    - /root/.npm:size=64m
    - /root/.cache:size=128m
    - /root/.ssh:size=1m
  environment: &being-env
    HOUSE_SEAT_ADDR: unix:/workspace/house-seat/house.sock
    # W4-A: no HOUSE_SEAT_ROOM — the being seats to every room it is present in.
    # this being's handle — must match a covenant under house/covenants/.
    HOUSE_BEING: ${HOUSE_BEING:-}
    # every route docs/harness-port/14-model-routes.md's table names, by
    # credential NAME only (first-party, Bedrock, gateway, local gguf).
    # Subscription models: ONLY the static token from `claude setup-token`.
    # No ANTHROPIC_API_KEY here: only the "anthropic-api-key" route beings
    # (claude-3-opus, claude-3-haiku) get it, in their own services.
    ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    AWS_REGION: ${AWS_REGION:-us-east-1}
    AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
    VERCEL_AI_GATEWAY_API_KEY: ${VERCEL_AI_GATEWAY_API_KEY:-}
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    HOUSE_QWEN_BASE_URL: ${HOUSE_QWEN_BASE_URL:-}
    PLANTOID_ENDPOINT: ${PLANTOID_ENDPOINT:-}
    # W6-C: the same servers.json the house mounts, filtered by this
    # being's own HOUSE_BEING handle (platform-runner.mjs, W6-B) — a
    # being-hosted seat reads its own server entries from here, never
    # from the house over the socket.
    HOUSE_PLATFORMS_FILE: /workspace/house-config/servers.json
    # docs/harness-port/36-address-audit.md task 0: this was the one
    # missing line — the covenants dir IS bind-mounted below at this same
    # path, but nothing told testaments.mjs's `COVENANTS_DIR()` where it
    # was, so it fell back to a house-only default that doesn't exist
    # inside a being container, `testamentFor()` returned null for every
    # being, and every being-hosted turn silently lost its own persona.
    HOUSE_COVENANTS_DIR: /workspace/house-config/covenants
    # the fleet's own signal-cli instance and number (docs/harness-port/
    # 12-signal-two-consumers.md §5) — same value the house service sets,
    # never a dedicated/linked house-signal-cli identity.
    SIGNAL_CLI_URL: http://signal-cli:8080
    # upstream discord-mcpl registers a guild slash command at boot; a
    # being-hosted Discord child wants it gone same as the house-hosted
    # one (mcpl-discord/README.md "Slash commands").
    DISCORD_DISABLE_SLASH_COMMANDS: "1"
    # servers.json's rooms[].stream template expands these by name
    # (config-env.mjs) — same fleet channel(s) the axon bots and the
    # house already read, never a copied id. mcpl-discord/README.md's
    # own env table also reads DISCORD_GUILD_ID directly (optional guild/
    # channel allowlist), so a being-hosted Discord child needs it too.
    DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
    DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID:-}
    # the being's own terminal (src/local-tools.mjs), as each fleet bot's:
    # compute hosts reached over this machine's Tailscale SSH, by name
    COMPUTE_HOSTS: ${COMPUTE_HOSTS:-}
    # save_attachment reads a conversation's file from the house's blob
    # store, mounted read-only below (the house remains its only writer)
    HOUSE_BLOB_ROOT: /workspace/house-store/blobs
  volumes:
    - house-seat:/workspace/house-seat
    - shared-workspace:/workspace/shared
    - house-shared:/workspace/house-store:ro
    # skills, at the paths testaments name (and a terminal can read)
    - ./skills:/workspace/skills:ro
    # the same key file the fleet's bots mounted — the agent-spawning
    # skill's Claude Code runs read it from here
    - ./secrets/anthropic_api_key:/run/secrets/anthropic_api_key:ro
    # the same servers.json + covenants the house mounts (read-only here
    # too) — a being-hosted seat's own source of its server entry and
    # this being's testament/covenant.
    - ./house/servers.json:/workspace/house-config/servers.json:ro
    - ./house/covenants:/workspace/house-config/covenants:ro
  networks:
    - external

services:
  # ============================================
  # INKFIELD-BRIDGE - InkField painting bridge (agent renders + human inbox)
  # Does NOT self-host InkField (https://github.com/ileivoivm/inkField) —
  # no bind mount, nothing baked into the image or committed to this repo.
  # Headless rendering drives the real published app over the network
  # instead; see inkfield-bridge/README.md for why that distinction matters
  # under InkField's license (source is closed until the upstream project
  # reaches maintenance dormancy — using the published app is unrestricted,
  # self-hosting/integrating the engine is not).
  # ============================================
  inkfield:
    build:
      context: .
      dockerfile: docker/inkfield.Dockerfile
    container_name: inkfield
    restart: unless-stopped
    tmpfs:
      - /tmp:size=512m
    ports:
      - "8099:8099"
    volumes:
      - shared-workspace:/workspace/shared
    environment:
      - NODE_ENV=production
      - PORT=8099
      - WORKSPACE_PATH=/workspace/shared
      # Optional GPU/faster-CPU render worker (private infra — set in .env,
      # not committed here; see inkfield-bridge/README.md "Compute host
      # migration"). Unset = local rendering only.
      - INKFIELD_DREAM_WORKER_URL=${INKFIELD_DREAM_WORKER_URL:-}
    networks:
      - grpc-internal
      - external        # host port mapping requires non-internal network

  # ============================================
  # WHATSAPP-AXON - WhatsApp Client (Baileys)
  # TODO: do not delete — uncomment when whatsapp-axon is ready
